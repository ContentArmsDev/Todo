          render();
        } else if (action === "delete-tag") {
          if (state.pendingTagDelete !== id) {
            state.pendingTagDelete = id;
            state.restoreFocus = `del-${id}`;
            render();
            return;
          }
          const tag = tagById(id);
          state.tags = state.tags.filter((item) => item.id !== id);
          state.assignments.forEach((item) => { item.tagIds = item.tagIds.filter((tagId) => tagId !== id); });
          if (state.editor) state.editor.draft.tagIds = state.editor.draft.tagIds.filter((tagId) => tagId !== id);
          if (state.tagFilter === id) state.tagFilter = null;
          state.pendingTagDelete = null;
          announce(tag ? `Removed ${tag.name}` : "Removed tag");
          persist();
          render();
        } else if (action === "export") {
          exportBackup();
        } else if (action === "import") {
          document.getElementById("import-file")?.click();
        } else if (action === "cancel-import") {
          state.pendingImport = null;
          state.importError = "";
          render();
        } else if (action === "confirm-import") {
          applyImport();
        }
      }

      function onInput(event) {
        const target = event.target;
        if (target.id === "search") {
          state.query = target.value;
          render();
          return;
        }
        if (target.id === "quick") {
          if (state.quickError) {
            state.quickError = "";
            render();
          }
          return;
        }
        if (target.id === "manage-tag") {
          state.manageDraftName = target.value;
          if (state.manageError) state.manageError = "";
          return;
        }
        if (!state.editor && target.dataset.action !== "rename-tag") return;
        if (target.id === "field-title") {
          state.editor.draft.title = target.value;
          if (state.editor.draft.error) {
            state.editor.draft.error = "";
            render();
          }
        } else if (target.id === "field-notes") {
          state.editor.draft.notes = target.value;
        } else if (target.dataset.action === "subtask-title") {
          const step = state.editor.draft.subtasks.find((item) => item.id === target.dataset.id);
          if (step) step.title = target.value;
        } else if (target.dataset.action === "rename-tag") {
          const tag = tagById(target.dataset.id);
          if (tag && target.value.trim()) {
            tag.name = target.value;
            persist();
          }
        } else if (target.id === "new-tag" && state.editor) {
          state.editor.draft.newTag = target.value;
          if (state.editor.draft.tagError) state.editor.draft.tagError = "";
        } else if (target.id === "new-sub" && state.editor) {
          state.editor.draft.newSub = target.value;
        }
      }

      function onChange(event) {
        const target = event.target;
        if (target.id === "import-file") {
          readImport(target);
          return;
        }
        if (target.dataset.action === "draft-due") {
          state.editor.draft.due = target.value;
          render();
        } else if (target.dataset.action === "draft-complete") {
          state.editor.draft.completed = target.checked;
        } else if (target.dataset.action === "toggle-subtask") {
          const step = state.editor.draft.subtasks.find((item) => item.id === target.dataset.id);
          if (step) step.done = target.checked;
          state.restoreFocus = `sub-${target.dataset.id}`;
          render();
        } else if (target.dataset.action === "cal-show-done") {
          state.showCompletedOnCalendar = target.checked;
          render();
        }
      }

      function onSubmit(event) {
        event.preventDefault();
        const action = event.target.dataset.action;
        if (action === "quick-add") quickAdd();
        else if (action === "save-editor") saveEditor();
        else if (action === "search-form") document.getElementById("search")?.focus();
        else if (action === "manage-add-tag") {
          const name = document.getElementById("manage-tag")?.value || "";
          const result = addTagName(name, state.manageColor);
          if (result.error || result.existing) {
            state.manageError = result.error || "That tag already exists.";
            state.restoreFocus = "manage-tag";
            render();
            return;
          }
          state.manageDraftName = "";
          state.manageError = "";
          announce(`Added tag ${result.tag.name}`);
          state.restoreFocus = "manage-tag";
          render();
        }
      }

      function onDragStart(event) {
        const chip = event.target.closest("[data-drag-id]");
        if (!chip) return;
        state.suppressClick = true;
        event.dataTransfer.setData("text/plain", chip.dataset.dragId);
        event.dataTransfer.effectAllowed = "move";
      }
      function onDragOver(event) {
        const day = event.target.closest(".day");
        if (!day) return;
        event.preventDefault();
        document.querySelectorAll(".day.drop").forEach((item) => { if (item !== day) item.classList.remove("drop"); });
        day.classList.add("drop");
      }
      function onDrop(event) {
        const day = event.target.closest(".day");
        if (!day) return;
        event.preventDefault();
        day.classList.remove("drop");
        const id = event.dataTransfer.getData("text/plain");
        const item = state.assignments.find((entry) => entry.id === id);
        if (!item || item.due === day.dataset.date) return;
        item.due = day.dataset.date;
        state.selectedDay = day.dataset.date;
        announce(`Moved ${item.title} to ${fmtShort.format(parseISO(item.due))}`);
        persist();
        render();
      }
      function onDragEnd() {
        document.querySelectorAll(".day.drop").forEach((item) => item.classList.remove("drop"));
        window.setTimeout(() => { state.suppressClick = false; }, 120);
      }

      document.addEventListener("keydown", (event) => {
        const dialog = document.querySelector('[role="dialog"]');
        const typing = event.target.matches("input, textarea, select");
        if (event.key === "Escape" && dialog) {
          event.preventDefault();
          if (state.confirmClear) { state.confirmClear = false; render(); return; }
          if (state.pendingImport || state.importError) { state.pendingImport = null; state.importError = ""; render(); return; }
          if (state.manage) { state.manage = false; state.restoreFocus = state.editor ? "edit-tags" : "manage-side"; render(); return; }
          if (state.editor) closeEditor(false);
          return;
        }
        if (event.key === "Tab" && dialog) {
          const nodes = [...dialog.querySelectorAll("button, input, textarea, select, a[href], summary")].filter((el) => !el.disabled && el.tabIndex !== -1);
          if (!nodes.length) return;
          const first = nodes[0];
          const last = nodes[nodes.length - 1];
          if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
          else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
        }
        if (!dialog && !typing && (event.key === "n" || event.key === "N")) {
          event.preventDefault();
          openEditor(null, state.view === "calendar" ? state.selectedDay : null);
        }
        if (!dialog && !typing && event.key === "/") {
          event.preventDefault();
          state.view = state.assignments.length ? state.view : "list";
          render();
          document.getElementById("search")?.focus();
        }
        if (event.key === "Enter" && event.target.dataset?.action === "subtask-title") {
          event.preventDefault();
        }
        if (event.key === "Enter" && (event.target.dataset.action === "new-subtask" || event.target.dataset.action === "new-tag")) {
          event.preventDefault();
          if (event.target.dataset.action === "new-subtask") addSubtask();
          else addDraftTag();
        }
      });

      app.addEventListener("click", onClick);
      app.addEventListener("input", onInput);
      app.addEventListener("change", onChange);
      app.addEventListener("submit", onSubmit);
      app.addEventListener("dragstart", onDragStart);
      app.addEventListener("dragover", onDragOver);
      app.addEventListener("drop", onDrop);
      app.addEventListener("dragend", onDragEnd);

      state.selectedDay = todayISO();
      load();
      render();
    })();
  </script>
</body>
</html>
